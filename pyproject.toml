[project]
name = "revola-themes"
version = "0.1.0"
description = "Theme compiler for RevolaOS"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["COPYING", "NOTICE"]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.5"]

[project.urls]
Homepage = "https://github.com/RevolaOS/themes"
Documentation = "https://github.com/RevolaOS/themes/tree/main/docs"

[project.scripts]
rvt = "rvt.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rvt", "rvt.data"]

[tool.setuptools.package-data]
"rvt.data" = ["*.json", "*.h"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build", ".build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
